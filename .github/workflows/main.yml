name: Live Cloud APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Fix Permissions for gradlew
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Bhai gradlew file pure project me kahi nahi mili!"
          exit 1
        fi
        echo "Gradlew found at: $GRADLEW_PATH"
        chmod +x "$GRADLEW_PATH"
        echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

    - name: Build Debug APK
      run: |
        cd ${{ env.GRADLEW_DIR }}
        ./gradlew assembleDebug

    - name: Find and Upload APK Automatically
      uses: actions/upload-artifact@v4
      with:
        name: Oreks-GPS-App
        path: "**/build/outputs/apk/debug/*.apk"
