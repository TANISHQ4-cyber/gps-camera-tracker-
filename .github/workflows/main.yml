name: Ultimate Smart APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Find and Move to Android Root Directory
      run: |
        # Yeh command dhoondegi ki build.gradle file kis folder me chhupi hai
        GRADLE_ROOT=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v ".github" | head -n 1)
        GRADLE_DIR=$(dirname "$GRADLE_ROOT")
        echo "Android project root found at: $GRADLE_DIR"
        echo "PROJECT_ROOT=$GRADLE_DIR" >> $GITHUB_ENV

    - name: Build Debug APK from Project Root
      run: |
        cd ${{ env.PROJECT_ROOT }}
        # Agar gradlew file nahi hai, toh automatic fresh wrapper banayega
        if [ ! -f gradlew ]; then
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Automatically
      uses: actions/upload-artifact@v4
      with:
        name: Oreks-GPS-Tracker-APK
        path: "**/build/outputs/apk/debug/*.apk"
