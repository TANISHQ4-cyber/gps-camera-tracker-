name: Compatible Cloud APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Humne Java version 17 se badal kar 8 kar diya hai purane gradle ke liye
    - name: set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Generate Fresh Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Find and Upload APK Automatically
      uses: actions/upload-artifact@v4
      with:
        name: Oreks-GPS-App
        path: "**/build/outputs/apk/debug/*.apk"
