name: Ultimate Cloud APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        echo "Bhai naya gradle install ho gaya hai cloud par!"

    - name: Generate Fresh Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew
        echo "Bhai gradlew file automatic generate kar di hai!"

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Find and Upload APK Automatically
      uses: actions/upload-artifact@v4
      with:
        name: Oreks-GPS-App
        path: "**/build/outputs/apk/debug/*.apk"
